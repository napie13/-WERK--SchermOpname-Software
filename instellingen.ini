; Instellingen van Examenopname.
; Maak.cmd overloopt deze waarden een voor een en bewaart je antwoorden hier.
; Het paswoord staat hier bewust niet in: Maak.cmd vraagt het bij elke bouw
; en zet enkel een versleutelde versie (hash) in het pakket.

; Versienummer van het pakket. Verhoog dit bij elke nieuwe uitrol (bv. 1.0.1).
Versie=1.0.0

; Map op de laptop waar de opnames komen.
OpnameMap=C:\Examenopnames

; Minimaal aantal GB vrije ruimte om een opname te mogen starten.
MinVrijGB=5

; Beelden per seconde. 5 is genoeg om alles te volgen en houdt de bestanden klein.
Fps=5

; Beeldkwaliteit: lager is scherper maar groter. Tussen 28 en 32 is goed.
Kwaliteit=30

; Na hoeveel uur een vergeten opname automatisch stopt.
MaxUren=6

; Na hoeveel dagen oude opnames automatisch verwijderd worden.
BewaarDagen=60
