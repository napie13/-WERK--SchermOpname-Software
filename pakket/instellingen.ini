; Instellingen voor Examenopname

; Waar de opnames op de laptop komen. Leerlingen kunnen hier niets verwijderen.
OpnameMap=C:\Examenopnames

; Niet starten onder deze vrije ruimte, waarschuwen onder de tweede waarde (in GB)
MinVrijGB=5
WaarschuwVrijGB=1

; Beeldjes per seconde, kwaliteit (lager = scherper en groter, 28 tot 32 is goed) en maximale breedte
Fps=5
Kwaliteit=30
MaxBreedte=1920

; Lengte van één videodeel, maximale examenduur en binnen hoeveel minuten een onderbroken opname nog hervat
DeelMinuten=10
MaxUren=6
HervatBinnenMinuten=30

; Na hoeveel dagen oude opnames automatisch verwijderd worden
BewaarDagen=60

; Wordt ingevuld bij het bouwen op GitHub, vanuit het geheim LEERKRACHT_PASWOORD
PaswoordHash=
