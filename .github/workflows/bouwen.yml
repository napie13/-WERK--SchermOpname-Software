name: Intune-pakket bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bouwen:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Programma compileren
        run: |
          New-Item build\pakket -ItemType Directory -Force | Out-Null
          Copy-Item pakket\*, src\logo.png build\pakket
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize /target:winexe `
            /win32icon:src\logo.ico /out:build\pakket\Examenopname.exe `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll src\*.cs
          if ($LASTEXITCODE) { exit 1 }

      - name: FFmpeg ophalen en controleren
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Invoke-WebRequest "$url.sha256" -OutFile ffmpeg.sha256
          $verwacht = (Get-Content ffmpeg.sha256 -Raw).Trim().Split()[0]
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne $verwacht) { throw 'Controlegetal van FFmpeg klopt niet' }
          Expand-Archive ffmpeg.zip ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName build\pakket
          Copy-Item (Join-Path $bin.Directory.Parent.FullName LICENSE) build\pakket\ffmpeg-licentie.txt

      - name: Paswoord van de leerkracht instellen
        env:
          PASWOORD: ${{ secrets.LEERKRACHT_PASWOORD }}
        run: |
          if ("$env:PASWOORD".Length -lt 10) { throw 'Stel eerst het geheim LEERKRACHT_PASWOORD in (minstens 10 tekens), zie README.' }
          $salt = [byte[]]::new(16)
          [Security.Cryptography.RandomNumberGenerator]::Fill($salt)
          $hash = [Security.Cryptography.Rfc2898DeriveBytes]::Pbkdf2($env:PASWOORD, $salt, 100000, 'SHA256', 32)
          $regel = 'PaswoordHash=pbkdf2-sha256$100000$' + [Convert]::ToBase64String($salt) + '$' + [Convert]::ToBase64String($hash)
          $ini = 'build\pakket\instellingen.ini'
          (Get-Content $ini) | ForEach-Object { if ($_ -like 'PaswoordHash=*') { $regel } else { $_ } } | Set-Content $ini

      - name: Intune-pakket maken
        run: |
          Invoke-WebRequest 'https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/master/IntuneWinAppUtil.exe' -OutFile IntuneWinAppUtil.exe
          .\IntuneWinAppUtil.exe -c build\pakket -s install.cmd -o build -q
          if (-not (Test-Path build\install.intunewin)) { throw 'Intune-pakket werd niet gemaakt' }
          Rename-Item build\install.intunewin Examenopname.intunewin

      - uses: actions/upload-artifact@v4
        with:
          name: Examenopname-intune
          path: build/Examenopname.intunewin

      - uses: actions/upload-artifact@v4
        with:
          name: Examenopname-testmap
          path: build/pakket
